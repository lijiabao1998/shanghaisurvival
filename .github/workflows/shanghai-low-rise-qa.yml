name: Shanghai identity details screenshot QA
on:
  push:
    branches: [feat/shanghai-identity-details-20261030]
    paths: [web/**, .github/workflows/shanghai-low-rise-qa.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated district candidate
        run: |
          cd web
          npm ci
          GOMAXPROCS=1 NODE_OPTIONS=--max-old-space-size=128 npm run build
          for f in tools/test-*.mjs; do node "$f"; done
      - name: Install browser tooling in temporary workspace
        run: |
          npm init -y
          npm install --save-exact playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture district candidate only (not production)
        run: |
          mkdir -p evidence
          mkdir -p /tmp/qa-root/shanghaisurvival
          cp -a web/dist/. /tmp/qa-root/shanghaisurvival/
          python3 -m http.server 4173 --directory /tmp/qa-root > /tmp/server.log 2>&1 &
          cat > test.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const report={url:'http://127.0.0.1:4173/shanghaisurvival/survival.html',commit:process.env.GITHUB_SHA,scope:'Shanghai identity details candidate, not production',runner:process.env.RUNNER_OS,checks:[],errors:[],requests:[]};
            try {
              const context=await browser.newContext({viewport:{width:1440,height:900}});
              const page=await context.newPage();
              page.on('pageerror',e=>report.errors.push(e.message));
              page.on('response',r=>{if(r.status()>=400)report.requests.push({url:r.url(),status:r.status()})});
              await page.goto(report.url+'?debug',{waitUntil:'networkidle'});
              await page.waitForFunction(()=>!!window.__modu,{timeout:45000});
              await page.screenshot({path:'evidence/01-desktop-menu.png',fullPage:true});
              assert.equal(await page.locator('.who').count(),12);
              report.checks.push('12 characters rendered');
              await page.locator('.who').first().click();
              await page.locator('#ov-btn').click();
              await page.waitForFunction(()=>window.__modu.state().phase==='play');
              report.initial=await page.evaluate(()=>window.__modu.state());
              report.checks.push('new isolated sandbox entered');
              async function walkHome(p,mobile=false){
                await p.bringToFront();
                const cdp=mobile?await p.context().newCDPSession(p):null;
                // Natural keyboard movement toward the existing nearby doorway.
                for(let n=0;n<60;n++){
                  const s=await p.evaluate(()=>__modu.state());
                  const dx=s.shelter.outside[0]-s.spawn[0],dy=s.shelter.outside[1]-s.spawn[1];
                  if(Math.hypot(dx,dy)<2.2)break;
                  const right=dx+dy,forward=dy-dx;
                  const ks=[];if(Math.abs(right)>.3)ks.push(right>0?'KeyD':'KeyA');if(Math.abs(forward)>.3)ks.push(forward>0?'KeyW':'KeyS');
                  if(mobile){
                    const box=await p.locator('#survivor-joystick').boundingBox();
                    const x=box.x+box.width/2,y=box.y+box.height/2;
                    await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y}]});
                    await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:x+(Math.abs(right)>.3?Math.sign(right)*22:0),y:y-(Math.abs(forward)>.3?Math.sign(forward)*22:0)}]});
                    await p.waitForTimeout(180);
                    await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
                  }else{for(const k of ks)await p.keyboard.down(k);await p.waitForTimeout(100);for(const k of ks)await p.keyboard.up(k);}
                }
                report[mobile?'mobileAtDoor':'desktopAtDoor']=await p.evaluate(()=>__modu.state());
                if(mobile)await p.locator('#survivor-touch-action').tap();else await p.keyboard.press('KeyE');
                try{await p.waitForFunction(()=>__modu.state().inShelter);}catch(error){await p.screenshot({path:mobile?'evidence/mobile-entry-failure.png':'evidence/desktop-entry-failure.png'});throw error;}
              }
              assert.equal(await page.evaluate(()=>__modu.state().mode),'sandbox');
              await walkHome(page);
              await page.locator('.room-view-toggle').click();
              assert.equal(await page.evaluate(()=>__modu.state().roomView),true);
              assert.ok(await page.evaluate(()=>__modu.state().cameraViewHeight<20));
              await page.waitForFunction(()=>__modu.state().fadedBuildings.includes('cmab_327821_0'));
              report.desktopRoom=await page.evaluate(()=>__modu.state());
              await page.screenshot({path:'evidence/07-desktop-interior.png',fullPage:true});
              await page.locator('.room-view-toggle').click();
              assert.equal(await page.evaluate(()=>__modu.state().cameraViewHeight),44);
              assert.equal(await page.evaluate(()=>document.body.classList.contains('inspecting-shelter')),false);
              const rows=page.locator('.shelter-stock>div');
              await rows.nth(0).getByRole('button',{name:'存1',exact:true}).click();
              assert.equal(await page.evaluate(()=>__modu.state().stash.water),1);
              await rows.nth(0).getByRole('button',{name:'取1',exact:true}).click();
              assert.equal(await page.evaluate(()=>__modu.state().stash.water),0);
              await rows.nth(0).getByRole('button',{name:'存1',exact:true}).click();
              await page.locator('.shelter-exit').click();
              assert.equal(await page.evaluate(()=>__modu.state().inShelter),false);
              await page.reload({waitUntil:'networkidle'});
              await page.getByRole('button',{name:/繼續第/}).click();
              await page.waitForFunction(()=>__modu.state().phase==='play');
              assert.equal(await page.evaluate(()=>__modu.state().stash.water),1);
              report.checks.push('natural doorway entry, inspect/restore room panel, deposit/withdraw, exit and reload-resume preserve stash');
              await page.keyboard.down('KeyD');
              await page.waitForTimeout(1200);
              await page.keyboard.up('KeyD');
              await page.keyboard.press('KeyC');
              assert.equal(await page.evaluate(()=>window.__modu.state().sneaking),true);
              report.checks.push('movement input and sneak toggle');
              await page.screenshot({path:'evidence/02-desktop-play.png',fullPage:true});
              await page.keyboard.press('Tab');
              assert.equal(await page.evaluate(()=>window.__modu.state().bagOpen),true);
              await page.screenshot({path:'evidence/03-inventory.png',fullPage:true});
              await page.keyboard.press('Escape');
              assert.equal(await page.evaluate(()=>window.__modu.state().bagOpen),false);
              report.checks.push('inventory opens and Escape closes');
              await page.keyboard.press('Escape');
              assert.equal(await page.evaluate(()=>window.__modu.state().paused),true);
              await page.screenshot({path:'evidence/04-paused.png',fullPage:true});
              await page.keyboard.press('Escape');
              assert.equal(await page.evaluate(()=>window.__modu.state().paused),false);
              report.checks.push('pause resumes');
              report.final=await page.evaluate(()=>window.__modu.state());
              const mobile=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});
              const mp=await mobile.newPage();
              mp.on('pageerror',e=>report.errors.push('mobile: '+e.message));
              mp.on('response',r=>{if(r.status()>=400)report.requests.push({device:'mobile',url:r.url(),status:r.status()})});
              await mp.goto(report.url+'?debug',{waitUntil:'networkidle'});
              await mp.locator('.who').first().waitFor();
              await mp.screenshot({path:'evidence/05-mobile-menu.png',fullPage:true});
              await mp.locator('.who').first().click();
              await mp.locator('#ov-btn').click();
              await walkHome(mp,true);
              await mp.locator('.room-view-toggle').click();
              assert.ok(await mp.evaluate(()=>__modu.state().cameraViewHeight<20));
              await mp.waitForFunction(()=>__modu.state().roomView&&__modu.state().fadedBuildings.includes('cmab_327821_0'));
              report.mobileRoom=await mp.evaluate(()=>__modu.state());
              await mp.screenshot({path:'evidence/08-mobile-interior.png',fullPage:true});
              await mp.locator('.shelter-exit').click();
              assert.equal(await mp.evaluate(()=>__modu.state().inShelter),false);
              assert.equal(await mp.evaluate(()=>document.body.classList.contains('inspecting-shelter')),false);
              await mp.screenshot({path:'evidence/06-mobile-play.png',fullPage:true});
              report.mobileBeforeReload=await mp.evaluate(()=>({state:__modu.state(),storage:{...localStorage}}));
              await mp.reload({waitUntil:'networkidle'});
              await mp.waitForFunction(()=>!!window.__modu,{timeout:45000});
              report.mobileAfterReload=await mp.evaluate(()=>({state:__modu.state(),storage:{...localStorage},menu:document.querySelector('#campaign-mode')?.textContent,note:document.querySelector('#campaign-note')?.textContent}));
              await mp.screenshot({path:'evidence/09-mobile-resume-menu.png',fullPage:true});
              await mp.getByRole('button',{name:/繼續第/}).click();
              await mp.waitForFunction(()=>__modu.state().phase==='play');
              report.mobileResumed=await mp.evaluate(()=>__modu.state());
              report.checks.push('mobile viewport menu, street, interior panel toggle, exit and reload-resume (not physical-device performance)');
              assert.deepEqual(report.errors,[]);
              assert.deepEqual(report.requests,[]);
              report.checks.push('no desktop/mobile uncaught JavaScript or HTTP errors');
            } finally {
              fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shanghai-identity-detail-evidence
          path: evidence/
          retention-days: 7
