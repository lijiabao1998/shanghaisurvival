name: Deploy Pages
# Publishes web/dist to GitHub Pages on every push to main (Settings → Pages → Source: GitHub Actions).
# The account's custom domain serves it at https://game.lijiabao.uk/shanghaisurvival/
# (the game itself is survival.html; index.html is the street viewer).
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Every built asset resolves under /shanghaisurvival/
        run: node tools/test-subpath-assets.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
