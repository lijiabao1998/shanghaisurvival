<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上海倖存者 · 屍群壓力測試</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #89948c; color: #f3f1e9;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
    #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    #panel { position: fixed; top: 14px; left: 14px; width: 330px; padding: 14px 16px; border-radius: 6px;
      background: #1d2422ee; border: 1px solid #ffffff1f; box-shadow: 0 8px 30px #0004; }
    h1 { margin: 0; font-size: 15px; letter-spacing: .06em; }
    h1 span { margin-left: 6px; color: #9fb59f; font-weight: 400; font-size: 11px; }
    .mode { margin-top: 10px; font-size: 12px; color: #cfe0cd; }
    .big { margin: 6px 0 2px; font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .big small { margin-left: 6px; font-size: 13px; font-weight: 500; color: #a8bda9; }
    .sub { font-size: 11px; line-height: 1.5; color: #b9c7b7; font-variant-numeric: tabular-nums; }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    button { flex: 1 1 auto; padding: 6px 9px; border: 1px solid #ffffff2e; border-radius: 4px;
      background: #2b3733; color: #e9eee7; font-size: 11px; cursor: pointer; }
    button:hover { background: #3a4a44; }
    button.on { background: #6d8a6f; border-color: #a8c9a6; color: #10201a; font-weight: 700; }
    button:disabled { opacity: .4; cursor: default; }
    #results tr.bad td { color: #e6a293; }
    #status { margin-top: 10px; font-size: 10px; line-height: 1.5; color: #d8c9a2; }
    #results { position: fixed; right: 14px; bottom: 14px; width: 440px; max-height: 46vh; overflow: auto;
      border: 1px solid #ffffff1f; border-radius: 6px; background: #1d2422ee; font-size: 11px; }
    #results table { width: 100%; border-collapse: collapse; }
    #results th, #results td { padding: 4px 8px; text-align: right; font-variant-numeric: tabular-nums; }
    #results th:first-child, #results td:first-child { text-align: left; }
    #results thead th { position: sticky; top: 0; background: #26302c; font-weight: 600; color: #b9c7b7; }
    #results tbody tr:nth-child(odd) { background: #ffffff08; }
    .hint { position: fixed; left: 14px; bottom: 14px; font-size: 10px; color: #e8ece5cc; text-shadow: 0 1px 2px #0008; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <section id="panel">
    <h1>屍群壓力測試 <span>上海倖存者</span></h1>
    <div class="mode" id="mode">—</div>
    <div class="big"><span id="fps">—</span><small>fps</small></div>
    <div class="sub" id="ms">暖機中…</div>
    <div class="sub" id="info"></div>
    <div class="sub" id="count">0 隻</div>
    <div class="btns">
      <button data-mode="instanced" class="on">1 · Instanced</button>
      <button data-mode="mesh">2 · Mesh</button>
      <button data-mode="skinned">3 · Skinned</button>
    </div>
    <div class="btns">
      <button id="less">−25</button>
      <button id="more">+25</button>
      <button id="ramp">爬坡</button>
      <button id="bench">三模式全跑</button>
      <button id="save">匯出 JSON</button>
    </div>
    <div id="status">載入中…</div>
  </section>

  <section id="results">
    <table>
      <thead><tr><th>模式</th><th>數量</th><th>fps</th><th>平均 ms</th><th>p95 ms</th><th>calls</th><th>自檢</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <div class="hint">WASD 移動 · 滾輪縮放 · 1/2/3 切換模式 · −/+ 調整數量 · R 爬坡</div>
  <script type="module" src="/src/stress.ts"></script>
</body>
</html>
